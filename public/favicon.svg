<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Inner Glow / Border -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Bowl Gradient -->
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Warm Food / Steam Gradient -->
    <linearGradient id="warmGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Accent Coral Gradient -->
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle with Drop Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#borderGlow)" stroke-width="6" opacity="0.6" />

  <!-- Background Ambient Glow Behind Emblem -->
  <circle cx="256" cy="280" r="140" fill="#60A5FA" opacity="0.2" filter="url(#softGlow)" />

  <!-- House Roof (Mess/Home representation) -->
  <path d="M144 204 L256 112 L368 204" 
        fill="none" 
        stroke="#93C5FD" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.95" />

  <!-- Little Chimney on the Roof -->
  <path d="M320 160 V124 H340 V176" 
        fill="none" 
        stroke="#93C5FD" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.9" />

  <!-- Rising Steam Waves (Warm Golden) -->
  <!-- Left Steam -->
  <path d="M216 260 C206 242 206 230 216 216 C226 202 226 190 216 174" 
        fill="none" 
        stroke="url(#warmGrad)" 
        stroke-width="12" 
        stroke-linecap="round" />

  <!-- Center Steam (Taller) -->
  <path d="M256 254 C244 234 244 220 256 202 C268 184 268 170 256 150" 
        fill="none" 
        stroke="url(#warmGrad)" 
        stroke-width="14" 
        stroke-linecap="round" />

  <!-- Right Steam -->
  <path d="M296 260 C286 242 286 230 296 216 C306 202 306 190 296 174" 
        fill="none" 
        stroke="url(#warmGrad)" 
        stroke-width="12" 
        stroke-linecap="round" />

  <!-- Food Content Inside Bowl (Warm Delicious Layer) -->
  <ellipse cx="256" cy="275" rx="120" ry="24" fill="url(#warmGrad)" filter="url(#shadow)" />

  <!-- Delicious Rice / Meal Mound -->
  <path d="M152 274 C164 242 210 232 256 232 C302 232 348 242 360 274 Z" fill="url(#coralGrad)" opacity="0.9" />

  <!-- The Main Meal Bowl -->
  <g filter="url(#shadow)">
    <!-- Bowl Body -->
    <path d="M136 272 C136 348 184 384 256 384 C328 384 376 348 376 272 C376 272 136 272 136 272 Z" 
          fill="url(#bowlGrad)" />

    <!-- Bowl Rim (Top Oval Edge) -->
    <ellipse cx="256" cy="272" rx="122" ry="16" fill="#FFFFFF" />

    <!-- Bowl Base Foot -->
    <path d="M208 384 C216 398 240 402 256 402 C272 402 296 398 304 384 Z" 
          fill="#CBD5E1" />
  </g>

  <!-- Cute Accent Star / Sparkle in Top Right -->
  <path d="M380 108 L386 122 L400 128 L386 134 L380 148 L374 134 L360 128 L374 122 Z" 
        fill="#FDE047" 
        opacity="0.9" />
</svg>
