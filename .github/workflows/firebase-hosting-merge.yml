name: Deploy to Firebase on merge

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: amader-mess-manager

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build

      # The service account used for hosting also deploys rules and seeds data.
      - name: Write service account credentials
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AMADER_MESS_MANAGER }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      # Rules and indexes go first so the new app never runs against the old rules.
      - name: Deploy Firestore rules and indexes
        run: npx --yes firebase-tools@latest deploy --only firestore --project "$FIREBASE_PROJECT_ID" --non-interactive

      # Idempotent, per mess: only writes cost categories / meal types that do not exist yet.
      - name: Seed default cost categories and meal types in every mess
        run: bun run seed --add-missing

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AMADER_MESS_MANAGER }}
          channelId: live
          projectId: amader-mess-manager

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
