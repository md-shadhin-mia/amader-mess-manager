name: Deploy to Firebase Hosting on merge

# Firestore rules and indexes are NOT deployed here: the hosting service
# account has no rules permissions. The project owner runs
# `firebase deploy --only firestore` whenever firestore.rules or
# firestore.indexes.json changes (see README.md).

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AMADER_MESS_MANAGER }}
          channelId: live
          projectId: amader-mess-manager
